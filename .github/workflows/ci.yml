name: CI

# The suite takes two seconds and used to run only when somebody remembered - and
# what this repository publishes is the gate that stops everybody else forgetting.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # A GitHub-hosted runner: a public repository must never run pull requests
    # from forks on a self-hosted machine. Its /bin/sh is dash, which is also the
    # strictest POSIX check this suite gets. Nothing is installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The harness's own gate, not a bare call to the suite: if CI ran something
      # different from what a person runs, one day one would pass and the other
      # would not, and nobody would know which one is right.
      - name: Full gate
        run: scripts/harness/verify --full
